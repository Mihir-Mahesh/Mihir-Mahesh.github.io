<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mihir Mahesh</title>
  <meta name="description" content="Mihir Mahesh: Computer Science and Mathematics at the University of Maryland. Computer architecture, quantum systems, and security." />
  <meta name="theme-color" content="#1f78d6" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- Link previews (LinkedIn, iMessage, Slack...). Once the site is hosted, make og:image a full URL, e.g. https://yourdomain/og-image.png -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mihir Mahesh" />
  <meta property="og:description" content="Mihir Mahesh: Computer Science and Mathematics at the University of Maryland. Computer architecture, quantum systems, and security." />
  <meta property="og:image" content="og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="night-sky" aria-hidden="true"></div>

  <header class="nav">
    <a class="plank brand" href="#top" data-initials></a>
    <nav>
      <a class="plank" href="#about">About</a>
      <a class="plank" href="#experience">Experience</a>
      <a class="plank" href="#publications">Publications</a>
      <a class="plank" href="#projects">Projects</a>
      <a class="plank" href="#skills">Skills</a>
      <a class="plank" href="monkeying-around.html">Monkeying around</a>
    </nav>
    <!-- A little wooden plank that freezes every animation on the page -->
    <button class="plank motion-toggle" type="button" aria-pressed="false">
      <svg class="mt-icon" viewBox="0 0 16 16" aria-hidden="true">
        <g class="mt-pause"><rect x="3.5" y="2.5" width="3" height="11" rx="1" /><rect x="9.5" y="2.5" width="3" height="11" rx="1" /></g>
        <path class="mt-play" d="M4.5 2.8v10.4a.8.8 0 0 0 1.2.7l8.2-5.2a.8.8 0 0 0 0-1.4L5.7 2.1a.8.8 0 0 0-1.2.7Z" />
      </svg>
      <span class="mt-label">Pause motion</span>
    </button>
  </header>

  <!-- Opening scene: open sky with drifting clouds (drawn by sky.js) -->
  <section class="scene" id="top">
    <!-- Click the sun to set it and raise the moon; click the moon to bring the day back -->
    <div class="celestial">
      <div class="orbit sun-orbit">
        <button class="sun" type="button" aria-label="Set the sun (switch to night)" title="Click to set the sun">
          <!-- The rays are their own layer so spinning them never repaints the face -->
          <span class="rays-wrap" aria-hidden="true"><svg viewBox="-60 -60 120 120"><g class="rays">
            <path d="M0 -58 L7 -42 L-7 -42Z M0 58 L7 42 L-7 42Z M-58 0 L-42 7 L-42 -7Z M58 0 L42 7 L42 -7Z" />
            <path d="M0 -58 L7 -42 L-7 -42Z M0 58 L7 42 L-7 42Z M-58 0 L-42 7 L-42 -7Z M58 0 L42 7 L42 -7Z" transform="rotate(30)" />
            <path d="M0 -58 L7 -42 L-7 -42Z M0 58 L7 42 L-7 42Z M-58 0 L-42 7 L-42 -7Z M58 0 L42 7 L42 -7Z" transform="rotate(60)" />
          </g></svg></span>
          <svg viewBox="-60 -60 120 120" aria-hidden="true">
            <circle class="core" r="34" />
            <g class="awake">
              <ellipse cx="-11" cy="-6" rx="3.4" ry="4.6" fill="#5a3600" />
              <ellipse cx="11" cy="-6" rx="3.4" ry="4.6" fill="#5a3600" />
              <path d="M-12 8 Q0 19 12 8" fill="none" stroke="#5a3600" stroke-width="3.2" stroke-linecap="round" />
            </g>
            <g class="sleepy">
              <path d="M-16 -5 Q-11 0 -6 -5 M6 -5 Q11 0 16 -5" fill="none" stroke="#5a2a00" stroke-width="3" stroke-linecap="round" />
              <ellipse cx="0" cy="12" rx="4" ry="5" fill="#5a2a00" />
            </g>
            <circle cx="-20" cy="6" r="5" fill="#ff8a65" opacity=".5" />
            <circle cx="20" cy="6" r="5" fill="#ff8a65" opacity=".5" />
          </svg>
        </button>
      </div>
      <div class="orbit moon-orbit">
        <button class="moon" type="button" aria-label="Raise the sun (switch to day)" title="Click to bring back the day">
          <svg viewBox="-60 -60 120 120" aria-hidden="true">
            <circle r="34" fill="#f7f2d8" stroke="#d6cb98" stroke-width="3" />
            <circle cx="14" cy="-16" r="6" fill="#e9dfb3" />
            <circle cx="20" cy="12" r="4" fill="#e9dfb3" />
            <circle cx="-18" cy="18" r="5" fill="#e9dfb3" />
            <path d="M-17 -4 Q-11 1 -5 -4 M5 -4 Q11 1 17 -4" fill="none" stroke="#6b5f3a" stroke-width="3" stroke-linecap="round" />
            <path d="M-6 10 Q0 15 6 10" fill="none" stroke="#6b5f3a" stroke-width="3" stroke-linecap="round" />
            <circle cx="-20" cy="6" r="4.5" fill="#f4a3a3" opacity=".5" />
            <circle cx="20" cy="6" r="4.5" fill="#f4a3a3" opacity=".5" />
          </svg>
          <span class="zzz" aria-hidden="true">z</span>
        </button>
      </div>
    </div>

    <!-- When this scrolls out of view the nav gets its background -->
    <span class="nav-sentinel" aria-hidden="true"></span>

    <div class="hero">
      <div class="scene-content">
        <p class="eyebrow" data-role></p>
        <h1 data-name></h1>
        <p class="lede" data-tagline></p>
        <div class="actions" data-links></div>
      </div>

      <!-- A parachuting monkey (added by forest.js) struggles to keep this photo aloft -->
      <div class="para">
        <figure class="photo-frame">
          <img data-photo alt="" width="1084" height="1358" />
        </figure>
      </div>
    </div>
  </section>

  <main>
    <section id="about" class="section">
      <h2 class="section-title"><span>01</span> Education</h2>
      <div class="edu card" data-education></div>
    </section>

    <section id="experience" class="section">
      <h2 class="section-title"><span>02</span> Experience</h2>
      <ol class="jobs" data-experience></ol>
    </section>

    <section id="publications" class="section">
      <h2 class="section-title"><span>03</span> Publications</h2>
      <div class="pubs" data-publications></div>
    </section>

    <section id="projects" class="section">
      <h2 class="section-title"><span>04</span> Projects</h2>
      <div class="projects" data-projects></div>
    </section>

    <section id="skills" class="section">
      <h2 class="section-title"><span>05</span> Skills</h2>
      <div class="skills card" data-skills></div>
    </section>
  </main>

  <!-- Closing scene: the forest floor (drawn by forest.js) -->
  <footer class="footer">
    <div class="footer-content">
      <p class="footer-cta">Let's talk.</p>
      <a class="footer-email" data-email></a>
      <p class="footer-note" data-copyright></p>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
  <script src="sky.js"></script>
  <script src="forest.js"></script>
</body>
</html>
